<!doctype html>
<html lang="{{lang}}" dir="{{dir}}" data-mode="{{mode}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="{{robots}}">
<meta name="theme-color" content="{{theme_color}}">
<link rel="alternate" hreflang="he" href="{{site_url}}/{{page_he}}">
<link rel="alternate" hreflang="en" href="{{site_url}}/en/{{page_en}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{site_name}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="{{site_url}}/{{og_image}}">
<meta property="og:locale" content="{{og_locale}}">
<link rel="icon" href="{{root}}images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?{{font_query}}&display=swap">
<link rel="stylesheet" href="{{root}}assets/base.css">
<link rel="stylesheet" href="{{root}}assets/host.css">
{{head_extra}}
</head>
<body class="{{body_class}}">
<a class="skip-link" href="#main">{{skip_label}}</a>
{{preview_bar}}
{{header}}
<main id="main">
{{content}}
</main>
{{footer}}
<script src="{{root}}assets/site.js" defer></script>
</body>
</html>
